<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ed.pageTitle">rk/noid level editor</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body class="editor">
  <header class="ed-bar">
    <a href="index.html" class="ed-logo" data-i18n-title="ed.backToGame"><img src="assets/logo.svg" alt="rk/noid"></a>
    <span class="ed-title" data-i18n="ed.title">Level editor</span>
    <button id="newBtn" class="btn" data-i18n="ed.new">New</button>
    <button id="openBtn" class="btn" data-i18n="ed.open">Open…</button>
    <select id="demoSelect" class="btn" data-i18n-title="ed.bundledTip"><option value="" data-i18n="ed.bundled">Bundled levels…</option></select>
    <button id="downloadBtn" class="btn" data-i18n="ed.download">Download JSON</button>
    <button id="copyBtn" class="btn" data-i18n="ed.copy">Copy JSON</button>
    <button id="undoBtn" class="btn" title="Ctrl+Z" data-i18n="ed.undo">↶ Undo</button>
    <button id="redoBtn" class="btn" title="Ctrl+Y" data-i18n="ed.redo">↷ Redo</button>
    <span class="grow"></span>
    <div class="lang-switch"></div>
    <button id="testBtn" class="btn primary" data-i18n="ed.test">▶ Test play</button>
    <input id="openInput" type="file" accept=".json,application/json" hidden>
  </header>

  <main class="ed-main">
    <!-- left: level properties -->
    <aside class="ed-side">
      <section>
        <h3 data-i18n="ed.level">Level</h3>
        <label><span data-i18n="ed.name">Name</span> <input id="f_name" type="text"></label>
        <label><span data-i18n="ed.nameCs">Name (Czech)</span> <input id="f_name_cs" type="text"></label>
        <label><span data-i18n="ed.author">Author</span> <input id="f_author" type="text"></label>
        <label><span data-i18n="ed.description">Description</span> <textarea id="f_description" rows="2"></textarea></label>
        <label><span data-i18n="ed.descriptionCs">Description (Czech)</span> <textarea id="f_description_cs" rows="2"></textarea></label>
        <div class="two">
          <label><span data-i18n="ed.cols">Columns</span> <input id="f_cols" type="number" min="3" max="31"></label>
          <label><span data-i18n="ed.rows">Rows</span> <input id="f_rows" type="number" min="1" max="30"></label>
        </div>
      </section>
      <section>
        <h3 data-i18n="ed.settings">Settings</h3>
        <div class="two">
          <label><span data-i18n="ed.ballSpeed">Ball speed</span> <input id="s_ballSpeed" type="number" step="0.5" min="3" max="20"></label>
          <label><span data-i18n="ed.ballSpeedMax">Max speed</span> <input id="s_ballSpeedMax" type="number" step="0.5" min="3" max="25"></label>
          <label><span data-i18n="ed.bonusChance">Bonus chance</span> <input id="s_bonusChance" type="number" step="0.01" min="0" max="1"></label>
          <label><span data-i18n="ed.critterSpeed">Critter speed</span> <input id="s_critterSpeed" type="number" step="0.1" min="0.3" max="6"></label>
          <label><span data-i18n="ed.depth">Field depth</span> <input id="s_depth" type="number" step="0.5" min="0" max="40" data-i18n-title="ed.depthTip"></label>
          <label><span data-i18n="ed.backGap">Back gap</span> <input id="s_backGap" type="number" step="0.1" min="0" max="5"></label>
          <label><span data-i18n="ed.floorColor">Floor tint</span> <input id="s_floorColor" type="color"></label>
          <label><span data-i18n="ed.wallColor">Wall tint</span> <input id="s_wallColor" type="color"></label>
        </div>
        <label><span data-i18n="ed.critterMode">Critter touches bat</span>
          <select id="s_critterMode">
            <option value="gameover" data-i18n="ed.cm.gameover">Game over</option>
            <option value="life" data-i18n="ed.cm.life">Lose a life</option>
          </select>
        </label>
      </section>
      <section>
        <h3 data-i18n="ed.check">Check</h3>
        <div id="stats" class="stats"></div>
        <ul id="problems" class="problems"></ul>
      </section>
      <details>
        <summary data-i18n="ed.rawJson">Raw JSON</summary>
        <textarea id="jsonArea" rows="14" spellcheck="false"></textarea>
        <button id="applyJsonBtn" class="btn" data-i18n="ed.applyJson">Apply JSON</button>
      </details>
    </aside>

    <!-- centre: grid editor -->
    <section class="ed-center">
      <div class="ed-tools">
        <div class="seg" id="modeSeg">
          <button data-mode="stack" class="on" data-i18n="ed.stackMode" data-i18n-title="ed.stackModeTip">Stack mode</button>
          <button data-mode="layer" data-i18n="ed.layerMode" data-i18n-title="ed.layerModeTip">Layer mode</button>
        </div>
        <div class="seg" id="layerSeg"></div>
        <button id="addLayerBtn" class="btn sm" data-i18n="ed.addLayer" data-i18n-title="ed.addLayerTip">+ layer</button>
        <button id="delLayerBtn" class="btn sm" data-i18n="ed.delLayer" data-i18n-title="ed.delLayerTip">− layer</button>
        <div class="seg" id="toolSeg">
          <button data-tool="paint" class="on" data-i18n="ed.paint">Paint</button>
          <button data-tool="erase" data-i18n="ed.erase">Erase</button>
          <button data-tool="fill" data-i18n="ed.rect" data-i18n-title="ed.rectTip">Rect</button>
          <button data-tool="pick" data-i18n="ed.pick" data-i18n-title="ed.pickTip">Pick</button>
        </div>
        <button id="mirrorBtn" class="btn sm" data-i18n="ed.mirror" data-i18n-title="ed.mirrorTip">Mirror ⇆</button>
        <button id="clearBtn" class="btn sm" data-i18n="ed.clear">Clear</button>
      </div>
      <div class="ed-gridwrap">
        <canvas id="grid"></canvas>
        <div class="ed-gridhint"><span data-i18n-html="ed.gridHint"></span> <span id="cellInfo"></span></div>
      </div>
      <div class="ed-palette">
        <div id="palette" class="palette"></div>
        <div class="entry" id="entryEditor">
          <h3><span data-i18n="ed.brickType">Brick type</span> <span id="entryKey" class="keychip"></span></h3>
          <div class="entry-grid">
            <label><span data-i18n="ed.char">Char</span> <input id="e_key" type="text" maxlength="1"></label>
            <label><span data-i18n="ed.type">Type</span>
              <select id="e_type">
                <option value="normal" data-i18n="type.normal">normal</option>
                <option value="hard" data-i18n="type.hard">hard</option>
                <option value="steel" data-i18n="type.steel">steel (indestructible)</option>
                <option value="armored" data-i18n="type.armored">armored (laser only)</option>
                <option value="explosive" data-i18n="type.explosive">explosive</option>
              </select>
            </label>
            <label><span data-i18n="ed.colour">Colour</span> <input id="e_color" type="color"></label>
            <label><span data-i18n="ed.hits">Hits</span> <input id="e_hits" type="number" min="1" max="9"></label>
            <label><span data-i18n="ed.drop">Drop</span>
              <select id="e_drop"></select>
            </label>
            <label><span data-i18n="ed.texture">Texture</span>
              <select id="e_tex">
                <option value="" data-i18n="tex.default">(type default)</option>
                <option value="brick" data-i18n="tex.brick">brick</option>
                <option value="hard" data-i18n="tex.hard">hard</option>
                <option value="bonus" data-i18n="tex.bonus">bonus ?</option>
                <option value="critterBrick" data-i18n="tex.critterBrick">critter eyes</option>
                <option value="explosive" data-i18n="tex.explosive">explosive</option>
                <option value="armored" data-i18n="tex.armored">armored</option>
                <option value="steel" data-i18n="tex.steel">steel</option>
              </select>
            </label>
            <label class="check"><input id="e_critter" type="checkbox"> <span data-i18n="ed.releasesCritter">Releases a critter</span></label>
          </div>
          <div class="row">
            <button id="newEntryBtn" class="btn sm" data-i18n="ed.newType">+ New brick type</button>
            <button id="delEntryBtn" class="btn sm">Delete / reset</button>
          </div>
        </div>
      </div>
    </section>

    <!-- right: live 3D preview -->
    <section class="ed-preview">
      <canvas id="preview"></canvas>
      <div class="ed-prevhint" data-i18n-html="ed.previewHint"></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/editor.js"></script>
</body>
</html>
